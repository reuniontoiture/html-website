/* ---- ABSENCES ---- */
const ABS_COLS=[["trav","Travaillés"],["ABSENT","Absences"],["CONGÉS","Congés"],["ARRÊT DE TRAVAIL","Arrêts"],["FORMATION","Formation"],["AUTRE","Autre"],["NA","Non affectés"]];
function absPeriod(){const ref=S.absRef||(S.absRef=today());const m=S.absMode;let a,b,label;
  if(m==="semaine"){a=monday(ref);b=addDays(a,4);label="Semaine "+weekNo(a)+" · "+parse(a).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" – "+parse(b).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"})}
  else if(m==="mois"){const d=parse(ref);a=iso(new Date(d.getFullYear(),d.getMonth(),1));b=iso(new Date(d.getFullYear(),d.getMonth()+1,0));label=d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}
  else{const y=ref.slice(0,4);a=y+"-01-01";b=y+"-12-31";label="Année "+y}
  return{a,b,label}}
function workdays(a,b){const out=[];let d=a;while(d<=b){if(((parse(d).getDay()+6)%7)<5)out.push(d);d=addDays(d,1)}return out}
function absStats(p,dates){const r={ouv:0,trav:0,ABSENT:0,"CONGÉS":0,"ARRÊT DE TRAVAIL":0,FORMATION:0,AUTRE:0,NA:0};
  for(const date of dates){if(p.sortie&&date>=p.sortie)continue;if(horsPlage(p,date))continue;if((p.inactifs||[]).includes(monday(date)))continue;r.ouv++;
    const per=periodeEnCours(p,date);if(per){r[per.type==="ABSENCE"?"ABSENT":per.type in r?per.type:"AUTRE"]++;continue}
    const d=dayOf(date);if(d.abs.includes(p.nom)){r.ABSENT++;continue}
    if(d.eq.some(e=>e.ouv.includes(p.nom)))r.trav++;else r.NA++}
  r.abs=r.ABSENT+r["CONGÉS"]+r["ARRÊT DE TRAVAIL"]+r.FORMATION+r.AUTRE;r.pct=r.ouv?r.abs/r.ouv:0;return r}
/* une période (congés, arrêt…) remplace les absences ponctuelles et retire le gars des équipes sur ces jours */
function lierPeriode(nom,du,au){let n=0;for(const [k,d0] of allDays()){if(k<du||(au&&k>au))continue;const d=dayOf(k);const had=d.abs.includes(nom)||d.eq.some(e=>e.ouv.includes(nom));if(!had)continue;
    d.abs=d.abs.filter(x=>x!==nom);d.eq.forEach(e=>e.ouv=e.ouv.filter(o=>o!==nom));saveDay(k,d);n++}invalidate();return n}
const absPonct=(d,date)=>d.abs.filter(n=>{const p=S.personnel.find(x=>x.nom===n);return !(p&&periodeEnCours(p,date))});
/* calendrier mensuel des absences (dates par ouvrier) */
const ABS_T={ABSENT:["A","Absent","abs-a"],"CONGÉS":["C","Congés","abs-c"],"ARRÊT DE TRAVAIL":["Ar","Arrêt de travail","abs-r"],FORMATION:["F","Formation","abs-f"],AUTRE:["X","Autre","abs-x"]};
function absType(p,date){if(p.sortie&&date>=p.sortie)return null;if(horsPlage(p,date))return null;const per=periodeEnCours(p,date);if(per)return per.type==="ABSENCE"?"ABSENT":ABS_T[per.type]?per.type:"AUTRE";if(dayOf(date).abs.includes(p.nom))return"ABSENT";return null}
function absPlages(ds){/* ds = dates ouvrées consécutives d'un même type -> "2, 6–9 oct" */const out=[];let st=null,pv=null;const wd=d=>d;
  ds.forEach(d=>{if(st&&shiftWork(pv,1)===d){pv=d;return}if(st)out.push([st,pv]);st=d;pv=d});if(st)out.push([st,pv]);
  const f=x=>parse(x).getDate();const m=x=>parse(x).toLocaleDateString("fr-FR",{month:"short"});
  return out.map(([a,b])=>a===b?f(a)+" "+m(a):(f(a)+"–"+f(b)+" "+m(b))).join(", ")}
function absCalendrier(a,b){const P=(S.cout&&S.cout.params)||{};const fer=new Set(P.feries||FERIES_DEF);const days=workdays(a,b);const td=today();
  const people=S.personnel.filter(p=>days.some(d=>!(p.sortie&&d>=p.sortie)&&!horsPlage(p,d)));
  const rows=people.map(p=>{const t={};days.forEach(d=>{const x=absType(p,d);if(x&&!fer.has(d))(t[x]||(t[x]=[])).push(d)});return{p,t}});
  const head=`<tr><th class="gfix">Ouvrier</th>${days.map(d=>`<th class="gday ${d===td?"tdy":""} ${((parse(d).getDay()+6)%7)===0?"wst":""}">${JOURS[(parse(d).getDay()+6)%7].slice(0,1)}<br>${parse(d).getDate()}</th>`).join("")}</tr>`;
  const body=rows.map(({p,t})=>{const n=Object.values(t).reduce((s,l)=>s+l.length,0);
    return `<tr><th class="gfix">${esc(p.nom)}<small>${n?n+" j d'absence":"aucune absence"}</small></th>${days.map(d=>{if(fer.has(d))return `<td class="${d===td?"tdy":""}"><span class="go off" title="Jour férié"></span></td>`;
      if((p.sortie&&d>=p.sortie)||horsPlage(p,d))return `<td class="${d===td?"tdy":""}"><span class="go off" title="Pas dans l'effectif"></span></td>`;
      const x=absType(p,d);const ed=S.absEdit===p.nom+"|"+d;
      if(ed)return `<td class="${d===td?"tdy":""}"><select class="abssel" id="absed" data-absset="${esc(p.nom)}|${d}" aria-label="Absence de ${esc(p.nom)} le ${esc(dayLong(d))}"><option value="">Présent</option>${Object.entries(ABS_T).map(([k,v])=>`<option value="${esc(k)}" ${k===x?"selected":""}>${esc(v[1])}</option>`).join("")}</select></td>`;
      return `<td class="${d===td?"tdy":""}"><button class="abscell needwrite" data-absed="${esc(p.nom)}|${d}" title="${x?esc(ABS_T[x][1])+" – ":""}${esc(dayLong(d))} · cliquer pour modifier">${x?`<span class="go ${ABS_T[x][2]}">${ABS_T[x][0]}</span>`:""}</button></td>`}).join("")}</tr>`}).join("");
  const liste=rows.filter(r=>Object.keys(r.t).length).map(({p,t})=>`<tr><td><b>${esc(p.nom)}</b></td><td style="white-space:normal">${Object.keys(ABS_T).filter(k=>t[k]).map(k=>`<div><b class="${ABS_T[k][2]}t">${ABS_T[k][1]}</b> (${t[k].length} j) : ${esc(absPlages(t[k]))}</div>`).join("")}</td></tr>`).join("");
  const leg=Object.values(ABS_T).map(([c,l,cl])=>`<span class="row" style="gap:5px;font-size:12px"><span class="go ${cl}" style="display:inline-block;width:28px;margin:0">${c}</span>${l}</span>`).join("");
  return `<section class="stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h2>Calendrier des absences du mois</h2><div class="row" style="gap:12px">${leg}<button class="btn sm" data-abscal>Exporter les dates (Excel)</button></div></div>
    <div class="gwrap"><table class="gantt">${"<thead>"+head+"</thead>"}<tbody>${body}</tbody></table></div>
    <div class="tw"><table><thead><tr><th style="width:170px">Ouvrier</th><th>Dates d'absence du mois</th></tr></thead><tbody>${liste||`<tr><td colspan="2" class="mut">Aucune absence ce mois-ci.</td></tr>`}</tbody></table></div>
    <p class="sub" style="font-size:12px;margin:0">Clique une case pour poser ou retirer une absence (absent, congés, arrêt, formation…). Les jours qui se suivent sont regroupés en une seule période. Absences du planning et périodes saisies dans Personnel, y compris celles à venir ; jours fériés grisés.</p></section>`}
/* poser / retirer une absence d'un jour, quel que soit le motif */
function setAbsJour(nom,date,type){const p=S.personnel.find(x=>x.nom===nom);if(!p)return;const av=coutSoc();const d=dayOf(date);
  d.abs=d.abs.filter(x=>x!==nom);
  p.periodes=(p.periodes||[]).flatMap(x=>{if(!(x.du&&date>=x.du&&(!x.au||date<=x.au)))return[x];const o=[];if(x.du<date)o.push(Object.assign({},x,{au:addDays(date,-1)}));if(!x.au||x.au>date)o.push(Object.assign({},x,{du:addDays(date,1)}));return o});
  if(type==="ABSENT")d.abs.push(nom);
  else if(type){const prev=shiftWork(date,-1),next=shiftWork(date,1);const a=p.periodes.find(x=>x.type===type&&x.au&&x.au>=prev&&x.au<date);const b=p.periodes.find(x=>x.type===type&&x.du>date&&x.du<=next);
    if(a&&b){a.au=b.au;p.periodes=p.periodes.filter(x=>x!==b)}else if(a)a.au=date;else if(b)b.du=date;else p.periodes.push({type,du:date,au:date})}
  if(type)d.eq.forEach(e=>e.ouv=e.ouv.filter(o=>o!==nom));
  {clearTimeout(persT);const b={list:JSON.parse(JSON.stringify(S.personnel))};if(S.db)enqueue("config/personnel",()=>S.db.doc("config/personnel").set(b))}saveDay(date,d);invalidate();coutToast(type?prenom(nom)+" : "+ABS_T[type][1].toLowerCase()+" le "+fmtDay(date):prenom(nom)+" présent le "+fmtDay(date),av)}
function absCalCSV(){const {a,b,label}=absPeriod();const P=(S.cout&&S.cout.params)||{};const fer=new Set(P.feries||FERIES_DEF);const L=[["Ouvrier","Date","Jour","Type"]];
  S.personnel.forEach(p=>workdays(a,b).forEach(d=>{if(fer.has(d))return;const x=absType(p,d);if(x)L.push([p.nom,d.split("-").reverse().join("/"),dayLong(d),ABS_T[x][1]])}));
  saveFile("absences-dates-"+label.toLowerCase().replace(/[^a-z0-9éèàûô]+/gi,"-")+".csv","\ufeff"+L.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n"))}
VIEWS.absences=()=>{
  const {a,b,label}=absPeriod();const td=today();const end=b<td?b:td;const dates=a<=end?workdays(a,end):[];
  const people=S.personnel.filter(p=>!(p.sortie&&p.sortie<=a));
  const rows=people.map(p=>({p,r:absStats(p,dates)})).filter(x=>x.r.ouv>0);
  const T={ouv:0,abs:0};ABS_COLS.forEach(([k])=>T[k]=0);rows.forEach(({r})=>{T.ouv+=r.ouv;T.abs+=r.abs;ABS_COLS.forEach(([k])=>T[k]+=r[k])});
  const bar=v=>`<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;white-space:nowrap;min-width:130px"><span class="num">${pct(v)}</span><span style="width:70px;height:7px;border-radius:9px;background:var(--sunk);overflow:hidden;display:inline-block"><span style="display:block;height:100%;width:${Math.min(100,v*100)}%;background:${v>=.15?"var(--bad)":v>=.07?"var(--warn)":"var(--ok)"}"></span></span></div>`;
  const cell=v=>`<td class="r num ${v?"":"mut"}">${v||"·"}</td>`;
  const body=rows.map(({p,r})=>`<tr><td><b>${esc(p.nom)}</b><div class="mut" style="font-size:11.5px">${esc(p.cat)}</div></td><td class="r num">${r.ouv}</td>${ABS_COLS.map(([k])=>cell(r[k])).join("")}<td class="r num"><b>${r.abs}</b></td><td class="r">${bar(r.pct)}</td></tr>`).join("");
  let matrix="";
  if(S.absMode==="annee"){const y=a.slice(0,4);const months=[...Array(12)].map((_,m)=>{const ma=iso(new Date(+y,m,1)),mb=iso(new Date(+y,m+1,0));const e=mb<td?mb:td;return ma<=e?workdays(ma,e):[]});
    matrix=`<section><h2 style="margin-bottom:10px">Absences par mois</h2><div class="tw"><table><thead><tr><th>Ouvrier</th>${months.map((_,m)=>`<th class="r">${new Date(2026,m,1).toLocaleDateString("fr-FR",{month:"short"})}</th>`).join("")}<th class="r">Année</th></tr></thead><tbody>
    ${people.map(p=>{const tot=absStats(p,dates);if(!tot.ouv)return"";return `<tr><td><b>${esc(p.nom)}</b></td>${months.map(ds=>{const r=absStats(p,ds);return r.ouv?`<td class="r"><span class="num ${r.pct>=.15?"neg":""}">${r.abs}</span> <span class="mut" style="font-size:11px">${Math.round(r.pct*100)}%</span></td>`:`<td class="r mut">–</td>`}).join("")}<td class="r num"><b>${tot.abs}</b> <span class="mut" style="font-size:11px">${pct(tot.pct)}</span></td></tr>`}).join("")}</tbody></table></div><p class="sub" style="font-size:12.5px">Chaque case : jours d'absence du mois et pourcentage des jours ouvrables.</p></section>`}
  const tab=(m,l)=>`<button class="btn ${S.absMode===m?"pri":""}" data-absmode="${m}">${l}</button>`;
  return `<div class="head"><div><h1>Récapitulatif des absences</h1><div class="sub">Par ouvrier : jours ouvrables (du lundi au vendredi, hors périodes inactives et après sortie), absences et pourcentage d'absence.</div></div>
  <button class="btn" data-abscsv>${ICON.reglages} Exporter en CSV</button></div>
  <div class="row" style="margin-bottom:16px;gap:12px">
    <div class="weekbar">${tab("semaine","Semaine")}${tab("mois","Mois")}${tab("annee","Année")}</div>
    <div class="weekbar"><button class="btn" data-absnav="-1" aria-label="Période précédente">${ICON.left}</button><span class="lbl" style="text-transform:capitalize">${label}</span><button class="btn" data-absnav="1" aria-label="Période suivante">${ICON.right}</button><button class="btn pri" data-absnav="0">Aujourd'hui</button></div>
  </div>
  <div class="stack">
  ${S.absMode==="mois"?absCalendrier(a,b):""}
  <div class="kpis">

    <div class="kpi"><h3>Absences ponctuelles</h3><div class="v num">${T.ABSENT}</div><div class="d">marquées dans le planning</div></div>
    <div class="kpi"><h3>Congés</h3><div class="v num">${T["CONGÉS"]}</div><div class="d">jours</div></div>
    <div class="kpi"><h3>Arrêts de travail</h3><div class="v num">${T["ARRÊT DE TRAVAIL"]}</div><div class="d">jours</div></div>

  </div>
  ${dates.length?`<div class="tw"><table><thead><tr><th>Ouvrier</th><th class="r">Ouvrables</th>${ABS_COLS.map(([,l])=>`<th class="r">${l}</th>`).join("")}<th class="r">Total abs.</th><th class="r">% absence</th></tr></thead><tbody>${body||`<tr><td colspan="11" class="mut">Aucun ouvrier actif sur cette période.</td></tr>`}

  ${matrix}
  </div>`};

VIEWS.reglages=()=>`<div class="head"><div><h1>Sauvegarde et mode d'emploi</h1></div></div>
  <div class="stack">
  <section class="panel pad stack"><h2>Sauvegarde</h2><p class="sub" style="margin:0">Les données sont enregistrées en ligne à chaque modification. Tu peux aussi télécharger une copie complète.</p>
  <div class="row"><button class="btn gold" data-backup>${ICON.reglages} Télécharger une sauvegarde</button><button class="btn" data-csv>Exporter la synthèse (CSV)</button></div></section>

  <p><b>Fiches chantier</b> : la main d'œuvre est calculée avec les jours du planning × le coût jour de chaque ouvrier. Une valeur saisie à la main dans « Jours saisis » remplace le planning.</p>
  <p><b>Bénéfice / jour</b> = marge ÷ nombre de jours où le chantier apparaît dans le planning. La rentabilité d'un jour additionne le bénéfice/jour des chantiers travaillés ce jour-là.</p>

  <p><b>Coût société</b> : charges fixes + salaires, divisés par les heures travaillées, donnent le coût horaire puis le coût d'une journée ouvrier. Ce coût s'applique automatiquement à la main d'œuvre des fiches chantier.</p>
  <p><b>Personnel</b> : un ouvrier inactif une semaine n'apparaît pas dans le planning et n'est pas contrôlé cette semaine-là.</p></section></div>`;

/* ============ ÉVÉNEMENTS ============ */
function evalQ(s){let t=String(s).trim().replace(/^=/,"").replace(/\s/g,"");if(!t)return{v:0,expr:null};
  if(/^-?\d+(?:[.,]\d+)?$/.test(t))return{v:parseFloat(t.replace(",",".")),expr:null};
  t=t.replace(/(\d),(\d)/g,"$1.$2");if(!/^[\d.+\-*/()]+$/.test(t))return null;
  try{const v=Function('"use strict";return ('+t+")")();if(!isFinite(v))return null;return{v,expr:s.trim().replace(/^=/,"")}}catch(e){return null}}
const numIn=s=>{const t=String(s).replace(/\s| |€/g,"").replace(",",".");const v=parseFloat(t);return isFinite(v)?v:0};
function later(){setTimeout(render,0)}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-view]");if(!b)return;const ds=b.dataset;
  if(S.userDone&&role()==="ouvrier"){if(S.canWrite)ouvClick(ds);return}
  if(ds.view){go(ds.view);return}
  if(ds.goch){const id=Object.keys(S.chantiers).find(k=>S.chantiers[k].nom===ds.goch);if(id)go("chantiers",{chantierId:id});return}
  if(ds.ch!==undefined&&b.tagName==="BUTTON"){go("chantiers",{chantierId:ds.ch});return}
  if(ds.wk!==undefined){S.weekStart=ds.wk==="0"?monday(today()):addDays(S.weekStart,+ds.wk);render();return}
  if(ds.cw!==undefined){S.ctrlWeek=ds.cw==="0"?monday(today()):addDays(S.ctrlWeek,+ds.cw);render();return}
  if(ds.pw){S.plMode="semaine";S.gEdit=null;go("planning",{weekStart:monday(ds.pw)});return}
  if(ds.sort){S.sort={k:ds.sort,d:S.sort.k===ds.sort?-S.sort.d:(ds.sort==="nom"?1:-1)};render();return}
  if(ds.ask){S.confirm=ds.ask;render();return}
  if(ds.cancel!==undefined){S.confirm=null;render();return}
  if(ds.csv!==undefined){exportCSV();return}

const AI_RULES=`Tu es l'assistant intégré au logiciel de pilotage de Réunion Toiture (entreprise de couverture à Saint-Pierre, La Réunion), utilisé par Kévin, le gérant.
Réponds toujours en français, de façon courte et concrète, sans jargon. Utilise des listes courtes si utile.
Règles du logiciel :
- Planning : jusqu'à 6 équipes par jour (lundi–vendredi), numérotées 1..n comme à l'écran ; chaque équipe a un chantier et des ouvriers.
- Main d'œuvre d'un chantier = jours de planning × coût journée ouvrier (calculé dans Coût société). Marge = marché HT − fournitures − main d'œuvre. Bénéfice/jour d'un chantier = marge ÷ jours de chantier. À l'accueil, « Bénéfice / jour travaillé » = marge réelle depuis le 1er janvier ÷ jours où au moins une équipe a travaillé.
- SAV : chaque dossier (numéro SAV-AAAA-NNN) a un client, un objet, un statut (ouvert, planifié, en attente, résolu), une date d'intervention et un prochain rappel. Les rappels reviennent chaque semaine (ou 14/30 jours) tant que le SAV n'est pas résolu.
- Rappels : devis à faire, rendez-vous, clients à rappeler, commandes, autre. Chacun a un titre, éventuellement un client, un téléphone, une adresse, un chantier, une date et une heure. Quand Kévin dit « rappelle-moi », « note que », « j'ai rendez-vous », « devis à faire pour… », crée un rappel avec l'outil rappels (action ajouter).
- Indisponibilités : congés, arrêts, formation (périodes), date de sortie, et pour indépendants/ouvriers de passage des périodes d'entrée/sortie.
Pour toute modification demandée, utilise les outils (ne dis jamais que c'est fait sans avoir appelé l'outil), puis résume en une ou deux phrases ce qui a été fait.
Convertis les dates relatives (demain, lundi prochain…) en AAAA-MM-JJ à partir de la date du jour. Si une demande est ambiguë (quel jour, quelle équipe), pose une seule question courte avant d'agir.
N'invente jamais de chantier ou d'ouvrier : utilise les noms des données ci-dessous.`;
function aiOutils(text){const max=Math.min(+AI.maxTools||16,16);let L=AI_TOOLS.slice();
  if(L.length>max&&!/pli|fa[iî]tage|rive|solin|noue|ar[eê]tier|d[ée]velopp/i.test(String(text||"")))L=L.filter(t=>t.name!=="pliages");
  if(L.length>max){const k=L.findIndex(t=>t.name==="pliages");if(k>=0&&L.length>max){const t=L.splice(k,1)[0];L=L.slice(0,max-1).concat([t])}}
  return L.slice(0,max)}

<script>
/* Réunion Toiture – carnet de détails (HTML à imprimer / envoyer) et DXF pour la plieuse.
   Construit à partir du résultat du métré (r). Chaque façonné : profil en coupe (segments + angles de pli),
   développé à plat avec la position des plis, liste des pièces à couper. */
(function(){
const f1=v=>Number(v).toLocaleString("fr-FR",{maximumFractionDigits:1});
const f2=v=>Number(v).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RAD=Math.PI/180;

/* Direction (degrés, 0 = vers la droite, 90 = vers le haut) de chaque partie du développé, dans l'ordre des parties.
   Le pli entre deux parties = changement de direction. Une partie de 0 cm est un simple pli. */
function directions(f){
  const P=f.developpe.parties.map(p=>p.partie);const nerv=P.some(n=>/nervure|70°/.test(n));
  const pa=+f.pente_a||20,pb=+f.pente_b||20,ang=+f.angle_pli_sommet||(180-pa-pb);
  const half=(180-ang)/2;
  switch(f.type){
    case "Rive caisson": // pointe du rechassé → coiffe sur la tôle → redescente → traversée sous le débord → retombée sur le mur
      return nerv?[70,0,-90,180,-90]:[15,0,-90,180,-90];
    case "Rive simple":   // rechassé → coiffe → retombée le long du bandeau → rechassé vers l'extérieur
      return nerv?[70,0,-90,-75]:[15,0,-90,-75];
    case "Solin rampant": // pointe du rechassé haut (silicone) → remontée sur le mur → retombée sur la tôle → rechassé bas
      return nerv?[-105,-90,0,-70]:[-105,-90,0,-15];
    case "Solin perpendiculaire":
      return P.length>3?[-105,-90,0,-90]:[-105,-90,0];
    case "Faîtage": // bout du côté A → montée vers le faîte → descente côté B → bout
      return nerv?[90,pa,0,-pb,-90]:[pa+15,pa,0,-pb,-pb-15];
    case "Arêtier":
      return [half+15,half,-half,-half-15];
    case "Noue": // pince repliée → descente vers le fond → remontée → pince
      return [-half+180,-half,0,half,half+180];
    default: return P.map(()=>0);
  }
}
/* segments du profil : [{nom, cm, dir}] (parties nulles = pli seul) */
function profil(f){const d=directions(f);return f.developpe.parties.map((p,i)=>({nom:p.partie,cm:+p.cm||0,dir:d[i]??0}))}
/* plis : position depuis le bord (cm), angle intérieur, sens (+ = vers le haut / − = vers le bas) */
function plis(seg){const nz=seg.filter(s=>s.cm>0);const out=[];let pos=0;
  nz.forEach((s,i)=>{if(i>0){let t=s.dir-nz[i-1].dir;while(t>180)t-=360;while(t<=-180)t+=360;
      if(Math.abs(t)>0.05)out.push({pos,idx:i,tour:t,angle:Math.round((180-Math.abs(t))*10)/10,sens:t>0?"haut":"bas"})}
    pos+=s.cm});
  return out}
function points(seg){let x=0,y=0;const pts=[[0,0]];seg.forEach(s=>{if(s.cm<=0)return;x+=s.cm*Math.cos(s.dir*RAD);y+=s.cm*Math.sin(s.dir*RAD);pts.push([x,y])});return pts}

/* regroupe les façonnés identiques (même type, mêmes parties, même angle) */
function groupes(r){const g=new Map();
  (r.faconnes||[]).forEach(f=>{if(!f.developpe||f.developpe.total_cm==null)return;
    const k=f.type+"|"+f.developpe.parties.map(p=>p.cm).join(",")+"|"+(f.angle_pli_sommet??"");
    if(!g.has(k))g.set(k,{type:f.type,f,items:[]});g.get(k).items.push(f)});
  return [...g.values()]}

/* dessin SVG du profil en coupe, avec cotes et angles */
function svgProfil(seg,W,H){
  const pts=points(seg);const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const pad=34,sc=Math.min((W-2*pad)/Math.max(mxx-mnx,1),(H-2*pad)/Math.max(mxy-mny,1));
  const X=x=>pad+(x-mnx)*sc+((W-2*pad)-(mxx-mnx)*sc)/2,Y=y=>H-pad-(y-mny)*sc-((H-2*pad)-(mxy-mny)*sc)/2;
  let s=`<polyline points="${pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="#5c2771" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  let k=0;seg.forEach(sg=>{if(sg.cm<=0)return;const a=pts[k],b=pts[k+1];k++;
    const mx=(X(a[0])+X(b[0]))/2,my=(Y(a[1])+Y(b[1]))/2;const nx=-Math.sin(sg.dir*RAD),ny=-Math.cos(sg.dir*RAD);
    s+=`<text x="${(mx+nx*14).toFixed(1)}" y="${(my+ny*14+4).toFixed(1)}" font-size="12" font-weight="700" text-anchor="middle" fill="#231a29">${f1(sg.cm)}</text>`});
  // angles aux plis
  plis(seg).forEach(p=>{const q=pts[p.idx];if(!q)return;
    s+=`<circle cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="3.5" fill="#d33a4a"/><text x="${(X(q[0])+7).toFixed(1)}" y="${(Y(q[1])-7).toFixed(1)}" font-size="10.5" fill="#d33a4a">${p.angle===0?"pince":f1(p.angle)+"°"}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;background:#fbf9fd;border:1px solid #e4d9ec;border-radius:10px">${s}</svg>`}

/* développé à plat : bande avec les plis */
function svgDeveloppe(seg,dev,W){const H=70,sc=(W-20)/Math.max(dev,1);let s=`<rect x="10" y="12" width="${(dev*sc).toFixed(1)}" height="${H-30}" fill="#eef2f6" stroke="#334"/>`;
  plis(seg).forEach(p=>{const x=10+p.pos*sc;s+=`<line x1="${x.toFixed(1)}" y1="12" x2="${x.toFixed(1)}" y2="${H-18}" stroke="#d33a4a" stroke-dasharray="4 3"/><text x="${x.toFixed(1)}" y="${H-5}" font-size="9.5" text-anchor="middle" fill="#d33a4a">${f1(p.pos)}</text>`});
  s+=`<text x="${(10+dev*sc/2).toFixed(1)}" y="9" font-size="10" text-anchor="middle" fill="#555">développé ${f1(dev)} cm</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${s}</svg>`}

function carnetHTML(r,opts){opts=opts||{};const G=groupes(r);const titre=(opts.chantier||r.modele||"Chantier");
  const css=`*{box-sizing:border-box}body{margin:0;font:13px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#231a29;background:#f3eef7}
  .page{background:#fff;max-width:800px;margin:12px auto;padding:22px 26px;border-radius:12px;box-shadow:0 1px 4px #0001}
  h1{font-size:20px;margin:0;color:#5c2771}h2{font-size:17px;margin:0 0 4px;color:#5c2771}.mut{color:#6b5f73;font-size:12px}
  table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:5px 7px;border-bottom:1px solid #e4d9ec;text-align:left;font-size:12.5px}th{font-size:10.5px;text-transform:uppercase;color:#6b5f73}
  td.r,th.r{text-align:right}.big{font-size:22px;font-weight:800;color:#5c2771}.kp{display:flex;gap:10px;margin:10px 0}.kp div{flex:1;background:#f6f1fa;border-radius:10px;padding:8px 10px}.kp small{display:block;font-size:10px;text-transform:uppercase;color:#6b5f73}
  .head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #9e0150;padding-bottom:8px;margin-bottom:12px}
  .noprint{text-align:center;margin:14px}.noprint button{font:inherit;font-weight:700;padding:10px 22px;border-radius:999px;border:0;background:#5c2771;color:#fff}
  @media print{body{background:#fff}.page{box-shadow:none;margin:0;max-width:none;border-radius:0;page-break-after:always}.noprint{display:none}}`;
  const ent=`<div class="head"><div><h1>${esc(titre)}</h1><div class="mut">Carnet de détails des pliages · Réunion Toiture</div></div><div class="mut">${esc(r.date||"")} · tôle ${esc((r.parametres||{}).type_tole||"ondulée")}</div></div>`;
  let pages=`<div class="page">${ent}<h2>Récapitulatif</h2><div class="kp"><div><small>Façonnés</small><span class="big">${(r.faconnes||[]).length}</span></div><div><small>Profils différents</small><span class="big">${G.length}</span></div><div><small>Tôles planes 1250</small><span class="big">${r.toles_planes?r.toles_planes.commande.map(c=>c.quantite+"×"+f2(c.longueur)).join(" + "):"—"}</span></div></div>
   <table><thead><tr><th>Fiche</th><th>Façonné</th><th class="r">Développé</th><th class="r">Pièces</th><th class="r">Mètres</th></tr></thead><tbody>${G.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.type)}</td><td class="r">${f1(g.f.developpe.total_cm)} cm</td><td class="r">${g.items.reduce((s,f)=>s+f.morceaux.length,0)}</td><td class="r">${f2(g.items.reduce((s,f)=>s+f.longueur,0))} m</td></tr>`).join("")}</tbody></table></div>`;
  G.forEach((g,i)=>{const seg=profil(g.f);const pl=plis(seg);
    const lignes=g.items.flatMap(f=>f.morceaux.map((m,j)=>({n:f.numero,j:j+1,k:f.morceaux.length,l:m,lr:f.longueur})));
    pages+=`<div class="page">${ent}<h2>Fiche ${i+1} — ${esc(g.type)}</h2><div class="mut">${g.f.pente_a!=null?"Pentes "+f1(g.f.pente_a)+"° / "+f1(g.f.pente_b)+"° · pli au sommet "+f1(g.f.angle_pli_sommet)+"° · ":""}Développé ${f1(g.f.developpe.total_cm)} cm</div>
     <div style="margin:10px 0">${svgProfil(seg,720,300)}</div>
     <div>${svgDeveloppe(seg,g.f.developpe.total_cm,720)}</div>
     <table><thead><tr><th>#</th><th>Partie</th><th class="r">Cote</th></tr></thead><tbody>${seg.map((s,k)=>`<tr><td>${k+1}</td><td>${esc(s.nom)}</td><td class="r">${f1(s.cm)} cm</td></tr>`).join("")}<tr><td></td><td><b>Développé total</b></td><td class="r"><b>${f1(g.f.developpe.total_cm)} cm</b></td></tr></tbody></table>
     <table><thead><tr><th>Pli</th><th class="r">Depuis le bord</th><th class="r">Angle</th><th>Sens</th></tr></thead><tbody>${pl.map((p,k)=>`<tr><td>${k+1}</td><td class="r">${f1(p.pos)} cm</td><td class="r">${p.angle===0?"pince 180°":f1(p.angle)+"°"}</td><td>${p.sens}</td></tr>`).join("")}</tbody></table>
     <table><thead><tr><th>Pièce</th><th class="r">Longueur à couper</th><th class="r">Longueur posée</th></tr></thead><tbody>${lignes.map(x=>`<tr><td>n° ${x.n}${x.k>1?" ("+x.j+"/"+x.k+")":""}</td><td class="r"><b>${f2(x.l)} m</b></td><td class="r">${f2(x.lr)} m</td></tr>`).join("")}</tbody></table></div>`});
  if(r.toles_planes&&r.toles_planes.feuilles.length&&typeof plaque==="function")
    pages+=`<div class="page">${ent}<h2>Découpe des tôles planes (1250 mm)</h2><div class="mut">À commander : ${r.toles_planes.commande.map(c=>c.quantite+" × "+f2(c.longueur)+" m").join(" + ")} · chute ${f1(r.toles_planes.chute_pct)} %</div><div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">${r.toles_planes.feuilles.map(fe=>plaque(fe,r.toles_planes.largeur_cm)).join("")}</div></div>`;
  const tl=(r.versants||[]).flatMap(v=>v.toles.map(t=>({v,t})));
  if(tl.length)pages+=`<div class="page">${ent}<h2>Tôles de couverture</h2><table><thead><tr><th>N°</th><th>Pan</th><th class="r">Longueur</th><th>Biais</th><th>Cintrage</th><th class="r">À commander</th></tr></thead><tbody>${tl.map(({v,t})=>`<tr><td>${t.numero}</td><td>${v.pans.join("+")}</td><td class="r">${f2(t.longueur_reelle)} m</td><td>${[t.biais_haut?"haut +20":"",t.biais_bas?"bas +20":""].filter(Boolean).join(", ")||"—"}</td><td>${t.cassures.map(c=>f1(c.angle_cintrage)+"° à "+f2(c.position)+" m").join(", ")||"—"}</td><td class="r"><b>${t.morceaux.map(f2).join(" + ")} m</b></td></tr>`).join("")}</tbody></table></div>`;
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carnet – ${esc(titre)}</title><style>${css}</style></head><body><div class="noprint"><button onclick="print()">Imprimer / enregistrer en PDF</button></div>${pages}</body></html>`}

/* ---- DXF (R12 ASCII, millimètres) : un fichier par profil ----
   calque PROFIL : coupe du pliage à l'échelle ; DEVELOPPE : bande à plat (développé × longueur) ; PLIS : lignes de pli ;
   TEXTE : angle et sens de chaque pli, cotes. */
function sansAccent(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\x20-\x7e]/g,"")}
function dxf(g){const L=[];const n=v=>(Math.round(v*1000)/1000).toString();
  const COUL={PROFIL:"6",DEVELOPPE:"5",PLIS:"1",TEXTE:"3"};
  const line=(lay,x1,y1,x2,y2)=>L.push("0","LINE","8",lay,"62",COUL[lay],"10",n(x1),"20",n(y1),"30","0","11",n(x2),"21",n(y2),"31","0");
  const text=(lay,x,y,h,t)=>L.push("0","TEXT","8",lay,"62",COUL[lay],"10",n(x),"20",n(y),"30","0","40",n(h),"1",sansAccent(t));
  const seg=profil(g.f),pl=plis(seg),dev=g.f.developpe.total_cm*10;
  // profil en coupe (mm), placé au-dessus du développé
  const pts=points(seg).map(p=>[p[0]*10,p[1]*10]);const mny=Math.min(...pts.map(p=>p[1])),mnx=Math.min(...pts.map(p=>p[0]));
  const oy=200-mny,ox=-mnx;for(let i=0;i+1<pts.length;i++)line("PROFIL",pts[i][0]+ox,pts[i][1]+oy,pts[i+1][0]+ox,pts[i+1][1]+oy);
  text("TEXTE",0,160,20,`${g.type} - developpe ${f1(g.f.developpe.total_cm).replace(",",".")} cm`);
  // développé à plat pour chaque longueur à couper
  const longs=[...new Set(g.items.flatMap(f=>f.morceaux))].sort((a,b)=>b-a);let y=0;
  longs.forEach(lm=>{const len=lm*1000;y-=len+300;
    line("DEVELOPPE",0,y,dev,y);line("DEVELOPPE",dev,y,dev,y+len);line("DEVELOPPE",dev,y+len,0,y+len);line("DEVELOPPE",0,y+len,0,y);
    pl.forEach((p,k)=>{const x=p.pos*10;line("PLIS",x,y,x,y+len);text("TEXTE",x+5,y+len+30+k*35,18,`${p.angle===0?"PINCE 180":Math.round(p.angle*10)/10+" deg"} ${p.sens==="haut"?"HAUT":"BAS"}`)});
    const q=g.items.reduce((s,f)=>s+f.morceaux.filter(m=>m===lm).length,0);
    text("TEXTE",0,y-60,30,`${q} x ${lm.toFixed(2)} m  -  largeur ${Math.round(dev*10)/10} mm`)});
  return ["0","SECTION","2","HEADER","9","$ACADVER","1","AC1009","9","$INSUNITS","70","4","0","ENDSEC","0","SECTION","2","ENTITIES",...L,"0","ENDSEC","0","EOF"].join("\r\n")}
function dxfFichiers(r){return groupes(r).map((g,i)=>({nom:`${String(i+1).padStart(2,"0")}-${sansAccent(g.type).replace(/\s+/g,"-")}-${String(g.f.developpe.total_cm).replace(".",",")}cm.dxf`,contenu:dxf(g)}))}

window.RTCarnet={carnetHTML,dxfFichiers,profil,plis,groupes,svgProfil,svgDeveloppe};
})();

</script>
<script>
/* ===== Pliages : développés, découpe, carnet et DXF directement dans le logiciel (mêmes règles que l'extension SketchUp) ===== */
const PL_P={rc_coiffe:16.7,rc_redescente:20,rc_retombee:5,so_remontee:20,so_rechasse_haut:1.5,so_retombee:15.2,so_rechasse_bas:1.5,sp_retombee:30,
  fa_retombee:30,fa_rechasse:1.5,faitage_dessus:0,ar_retombee:30,noue_retombee:35,noue_pince:2,rive_simple_retombee:25,rive_simple_rechasse:1.5,
  nv_coiffe:4,nv_rechasse:2.5,nv_plage:25,nv_retombee_nervure:4,nv_jeu:0.5,longueur_max:6,recouvrement:0.2,arrondi:0.5};
const PL_TYPES=["Rive caisson","Rive simple","Solin rampant","Solin perpendiculaire","Faîtage","Arêtier","Noue"];
const r1=v=>Math.round(v*10)/10;
function plAplomb(pente){const h=PL_P.nv_retombee_nervure-PL_P.nv_jeu;return pente?r1(h/Math.cos(pente*Math.PI/180)):h}
function plCoiffe(nerv){return nerv?[["Rechassé 70°",PL_P.nv_rechasse],["Coiffe : retombée sur la nervure",PL_P.nv_coiffe]]
  :[["Rechassé 15° (épouse l'ondulation)",1.5],["Coiffe (2 ondulations)",r1(PL_P.rc_coiffe-1.5)]]}
function plRecette(p,nerv){const P=PL_P;switch(p.type){
  case "Rive caisson":return plCoiffe(nerv).concat([["Redescente extérieure (pli 90°)",P.rc_redescente],["Traversée jusqu'au mur (pli 90°)",+p.trav||0],["Retombée sur le mur",P.rc_retombee]]);
  case "Rive simple":return plCoiffe(nerv).concat([["Retombée le long du bandeau bois (pli 90°)",P.rive_simple_retombee],["Rechassé 15° vers l'extérieur",P.rive_simple_rechasse]]);
  case "Solin rampant":{const h=[["Rechassé haut 15° (silicone)",P.so_rechasse_haut],["Remontée sur le mur",P.so_remontee]];
    return nerv?h.concat([["Plage de la tôle",P.nv_plage],["Rechassé 70°",P.nv_rechasse]]):h.concat([["Retombée sur la tôle (2 ondulations)",P.so_retombee],["Rechassé bas 15° (épouse l'ondulation)",P.so_rechasse_bas]])}
  case "Solin perpendiculaire":{const l=[["Rechassé haut 15° (silicone)",P.so_rechasse_haut],["Remontée sur le mur",P.so_remontee],["Retombée à plat sur la tôle",P.sp_retombee]];
    return nerv?l.concat([["Retombée dans la nervure (aplomb)",plAplomb(+p.pa||0)]]):l}
  case "Faîtage":return [nerv?["Côté A : retombée dans la nervure (aplomb)",plAplomb(+p.pa||0)]:["Côté A : rechassé",P.fa_rechasse],["Côté A : retombée sur le pan",P.fa_retombee],
    ["Dessus (pli au sommet)",P.faitage_dessus],["Côté B : retombée sur le pan",P.fa_retombee],nerv?["Côté B : retombée dans la nervure (aplomb)",plAplomb(+p.pb||+p.pa||0)]:["Côté B : rechassé",P.fa_rechasse]];
  case "Arêtier":return [["Côté A : rechassé",P.fa_rechasse],["Côté A : retombée sur le pan",P.ar_retombee],["Côté B : retombée sur le pan",P.ar_retombee],["Côté B : rechassé",P.fa_rechasse]];
  case "Noue":return [["Côté A : pince repliée 180°",P.noue_pince],["Côté A : retombée sur le pan",P.noue_retombee],["Fond : pliure en V (pas de largeur)",0],["Côté B : retombée sur le pan",P.noue_retombee],["Côté B : pince repliée 180°",P.noue_pince]];
  default:return []}}
/* morceaux égaux, 6 m maxi recouvrement compris, recouvrement 20 cm ajouté, arrondi au 0,50 supérieur */
function plCouper(l){const P=PL_P,up=x=>Math.round(Math.ceil(x/P.arrondi-1e-6)*P.arrondi*1000)/1000;if(!(l>0))return [];
  if(l>P.longueur_max){const k=Math.ceil((l-P.recouvrement)/(P.longueur_max-P.recouvrement)-1e-9);const pc=(l+(k-1)*P.recouvrement)/k;return Array(k).fill(up(pc))}
  return [up(l)]}
/* façonné au format du carnet (identique à l'extension) */
function plFaconne(p,i,nerv){const rec=plRecette(p,nerv);
  const parts=rec.map(([nom,v],k)=>({partie:nom,cm:p.cotes&&p.cotes[k]!=null?+p.cotes[k]:v}));
  const f={numero:i+1,type:p.type,longueur:+p.l||0,developpe:{parties:parts,total_cm:r1(parts.reduce((s,x)=>s+(+x.cm||0),0))},morceaux:plCouper(+p.l||0),repere:p.rep||""};
  if(p.type==="Faîtage"){f.pente_a=+p.pa||15;f.pente_b=+p.pb||+p.pa||15;f.angle_pli_sommet=r1(180-f.pente_a-f.pente_b)}
  if(p.type==="Arêtier"||p.type==="Noue")f.angle_pli_sommet=+p.ang||(p.type==="Noue"?150:150);
  return f}
function plData(c){const nerv=c.plTole==="1000P";const fs=(c.pliages||[]).map((p,i)=>plFaconne(p,i,nerv));
  return {modele:c.nom,date:new Date().toLocaleDateString("fr-FR"),parametres:{type_tole:nerv?"1000P (nervurée)":"ondulée"},faconnes:fs}}
function plSave(){const id=S.chantierId;if(id)saveChantier(id)}
function plRow(c){const n=(c.pliages||[]).length;
  return `<div class="row"><span class="mut" style="font-weight:700">📏 Pliages</span><button class="btn sm pri" data-view="pliages">${n?"Ouvrir les "+n+" pliage"+(n>1?"s":""):"Calculer les pliages"}</button><span class="mut" style="font-size:12px">développés, découpe en 6 m, carnet et DXF plieuse</span></div>`}

VIEWS.pliages=()=>{const id=S.chantierId,c=S.chantiers[id];
  if(!c)return `<div class="head"><div><h1>Pliages</h1><div class="sub">Choisis d'abord un chantier dans les fiches chantier.</div></div></div><button class="btn pri" data-view="chantiers">Fiches chantier</button>`;
  const L=c.pliages||[],nerv=c.plTole==="1000P",r=plData(c),RC=window.RTCarnet,open=S.plOpen||(S.plOpen={});
  const ro=S.canWrite?"":" disabled";
  const num=(k,i,v,ph,w)=>`<input id="qp-${k}-${i}" class="needwrite" data-qp="${k}" data-qpi="${i}" value="${v==null||v===""?"":String(v).replace(".",",")}" placeholder="${ph}" inputmode="decimal" style="width:${w||70}px"${ro}>`;
  const cards=L.map((p,i)=>{const f=r.faconnes[i];const seg=RC.profil(f);const pl=RC.plis(seg);
    const extra=p.type==="Rive caisson"?`<label class="mut">Traversée (cm) ${num("trav",i,p.trav,"ex 12")}</label>`
      :p.type==="Faîtage"?`<label class="mut">Pente A (°) ${num("pa",i,p.pa,"15",56)}</label><label class="mut">Pente B (°) ${num("pb",i,p.pb,"= A",56)}</label>`
      :(p.type==="Solin perpendiculaire"&&nerv)?`<label class="mut">Pente (°) ${num("pa",i,p.pa,"15",56)}</label>`
      :(p.type==="Arêtier"||p.type==="Noue")?`<label class="mut">Angle du pli (°) ${num("ang",i,p.ang,"150",56)}</label>`:"";
    const manque=p.type==="Rive caisson"&&!(+p.trav>0);
    const mc=f.morceaux;const grp={};mc.forEach(m=>grp[m]=(grp[m]||0)+1);
    return `<div class="panel pad stack" style="gap:8px">
      <div class="row" style="gap:10px;flex-wrap:wrap;align-items:center">
        <b style="color:var(--accent)">${i+1}</b>
        <select class="needwrite" data-qp="type" data-qpi="${i}"${ro}>${PL_TYPES.map(t=>`<option${t===p.type?" selected":""}>${t}</option>`).join("")}</select>
        <input id="qp-rep-${i}" class="needwrite" data-qp="rep" data-qpi="${i}" value="${esc(p.rep||"")}" placeholder="repère (ex : pan sud)" style="width:150px"${ro}>
        <label class="mut">Longueur totale (m) ${num("l",i,p.l,"ex 8,40",80)}</label>${extra}
      </div>
      <div class="row" style="gap:14px;flex-wrap:wrap;align-items:center">
        <span>Développé <b class="num" style="font-size:20px;color:var(--accent)">${manque?"traversée ?":nf.format(f.developpe.total_cm)+" cm"}</b>${p.cotes?' <span class="pill p-warn">cotes modifiées</span>':""}</span>
        <span>Pièces : <b>${mc.length?Object.entries(grp).map(([m,q])=>q+" × "+nf.format(+m)+" m").join(" + "):"—"}</b></span>
        <span class="mut">${pl.length} pli${pl.length>1?"s":""}</span>
        <span style="flex:1"></span>

  <div class="row needwrite" style="margin-top:12px;gap:8px;flex-wrap:wrap">${PL_TYPES.map(t=>`<button class="btn sm" data-qpadd="${t}">+ ${t}</button>`).join("")}</div>

async function plDxfSave(c,idx){const fs=plDxf(c,idx);const pre=(c.nom||"chantier").replace(/[^\wÀ-ÿ]+/g,"-")+"-";

/* commande vocale / assistant */
AI_TOOLS.push({name:"pliages",description:"Gère les pliages (façonnés) d'un chantier et calcule leurs développés avec les règles Réunion Toiture. action=lister renvoie les pliages avec développé (cm) et pièces à couper ; action=ajouter ajoute un pliage (type, longueur en m, et selon le type : traversee_cm pour une rive caisson, pente_a/pente_b en degrés pour un faîtage ou un solin perpendiculaire en 1000P, angle_pli pour arêtier/noue) ; action=supprimer retire le pliage numéro n ; action=tole règle la tôle ('ondulée' ou '1000P').",
  inputSchema:{type:"object",properties:{chantier:{type:"string"},action:{type:"string",enum:["lister","ajouter","supprimer","tole"]},type:{type:"string",enum:PL_TYPES},longueur:{type:"number"},repere:{type:"string"},traversee_cm:{type:"number"},pente_a:{type:"number"},pente_b:{type:"number"},angle_pli:{type:"number"},numero:{type:"integer"},tole:{type:"string",enum:["ondulée","1000P"]}},required:["chantier","action"]},
  execute:(a)=>{const {id,c}=findChantier(a.chantier);const sv=()=>{saveChantier(id);aiAct("Pliages de "+c.nom+" mis à jour")};
    if(a.action==="ajouter"){if(!a.type)throw new Error("type manquant");c.pliages=c.pliages||[];const p={type:a.type,l:+a.longueur||""};
      if(a.repere)p.rep=a.repere;if(a.traversee_cm)p.trav=a.traversee_cm;if(a.pente_a)p.pa=a.pente_a;if(a.pente_b)p.pb=a.pente_b;if(a.angle_pli)p.ang=a.angle_pli;c.pliages.push(p);sv()}
    else if(a.action==="supprimer"){const n=+a.numero;if(!c.pliages||!c.pliages[n-1])throw new Error("Pas de pliage n° "+n);c.pliages.splice(n-1,1);sv()}
    else if(a.action==="tole"){c.plTole=a.tole==="1000P"?"1000P":"";sv()}
    const r=plData(c);return JSON.stringify({chantier:c.nom,tole:r.parametres.type_tole,pliages:r.faconnes.map(f=>({n:f.numero,type:f.type,repere:f.repere,longueur_m:f.longueur,developpe_cm:f.developpe.total_cm,pieces_m:f.morceaux}))})}});

<script>

S.memo=S.memo||[];
(function memoSub(){if(!S.db||!S.db.doc){setTimeout(memoSub,800);return}

  const nom=/magali/i.test(brut)?"Magali":brut?brut.split(/\s+/)[0].toLowerCase().replace(/^./,x=>x.toUpperCase()):"";return{nom:nom||"une personne du bureau",prenom:nom,gerant:false}}
const BLAGUES=["Pourquoi les plongeurs plongent-ils toujours en arrière ? Parce que sinon ils tombent dans le bateau.", "Qu'est-ce qu'un crocodile qui surveille la pharmacie ? Un Lacoste garde.", "Que dit une imprimante dans l'eau ? J'ai papier.", "Pourquoi les couvreurs ne jouent jamais aux cartes ? Ils ont peur de se faire plier.", "Qu'est-ce qui est jaune et qui attend ? Jonathan.", "Comment appelle-t-on un chat tombé dans un pot de peinture le jour de Noël ? Un chat-peint de Noël.", "Que fait une fraise sur un cheval ? Tagada tagada.", "Pourquoi le livre de maths est-il triste ? Parce qu'il a trop de problèmes.", "Quel est le comble pour un couvreur ? Avoir un toit de travail à faire et rester sous la couette.", "Qu'est-ce qu'un canif ? Un petit fien.", "Pourquoi les poissons détestent l'ordinateur ? À cause du Net.", "Que dit un oignon quand il se cogne ? Aïe.", "Quel est le sport préféré des insectes ? Le cricket.", "Comment appelle-t-on un boomerang qui ne revient pas ? Un bout de bois.", "Pourquoi la tôle ondulée est toujours de bonne humeur ? Parce qu'elle a des hauts et des bas, mais elle reste droite dans ses vis.", "Qu'est-ce qu'une vache qui mange du gazon ? Une vache qui broute du gazon… et toi tu broutes des factures.", "Que dit un escargot sur le dos d'une tortue ? Wouhouuu, ça va vite !", "Pourquoi Magali est la meilleure ? Parce que sans elle, Kévin chercherait encore la facture de 2023.", "Quel est le comble pour un électricien ? De ne pas être au courant.", "Qu'est-ce qui a des dents mais ne mange jamais ? Un peigne.", "Pourquoi les fantômes sont de mauvais menteurs ? Parce qu'on voit à travers eux.", "Quel est le comble pour un comptable ? De ne pas savoir sur quel pied danser… alors qu'il a tous les chiffres.", "Que dit un zéro à un huit ? Joli ceinture !", "Pourquoi les pingouins ne volent pas ? Parce qu'ils ne sont pas pickpockets.", "Qu'est-ce qu'un chameau à trois bosses ? Un chameau qui s'est cogné.", "Quel est le comble pour un plombier ? D'avoir un fils qui a la fuite dans les idées.", "Comment fait-on pour allumer un barbecue breton ? On utilise des breizh.", "Pourquoi le lundi est le jour préféré des tôles ? Parce qu'on les pose enfin.", "Que dit un cafard à un autre cafard ? Rien, il a le cafard.", "Quel est le jour préféré de la secrétaire ? Le vendredi, parce que Kévin part sur les chantiers."];
S.bl0=null;(function blSub(){if(!S.db||!S.db.doc){setTimeout(blSub,800);return}try{S.db.doc("config/blagues").onSnapshot(s=>{S.bl0=s.exists?JSON.parse(JSON.stringify(s.data())):{}},()=>{S.bl0={}})}catch(e){S.bl0={}}})();
function blagueDuJour(){const c=(S.comptes||{})[S.uid]||{};const k=S.uid||"proprio";const d0=(S.bl0||{})[k]||c.blague0||today();const n=Math.round((new Date(today())-new Date(d0))/864e5);return n<=0?"As-tu fait caca ? 😄":BLAGUES[(n-1)%BLAGUES.length]}
(function bonjour(){if(!S.userDone||(S.db&&S.bl0===null)){setTimeout(bonjour,700);return}const q=aiQui();if(!q.prenom)return;const k=S.uid||"proprio";if(S.canWrite&&S.db&&S.bl0&&!S.bl0[k]&&!((S.comptes||{})[S.uid]||{}).blague0){S.bl0[k]=today();const b=JSON.parse(JSON.stringify(S.bl0));enqueue("config/blagues",()=>S.db.doc("config/blagues").set(b))}
  setTimeout(()=>toast("Bonjour "+q.prenom+", comment vas-tu aujourd'hui ? \n\nBlague du jour : "+blagueDuJour(),12000),600)})();
function memoTexte(){const L=S.memo||[];const q=aiQui();
  return (q.gerant?`\n\nPERSONNE QUI TE PARLE : Kévin, le gérant (propriétaire du logiciel).`:`\n\nPERSONNE QUI TE PARLE : ${q.nom}, pas Kévin (accès bureau, par exemple Magali, qui s'occupe de l'administratif). Adresse-toi à ${q.nom} par son prénom et parle de Kévin à la 3e personne. ${q.nom} peut t'apprendre des règles, mais seul Kévin peut modifier ou supprimer une règle apprise.`)+`\n\nAPPRENTISSAGE : quand la personne qui te parle t'explique comment il travaille, te donne une règle, une habitude, une préférence, ou te corrige (« non, chez nous on fait… », « retiens que… », « à chaque fois… »), enregistre-le tout de suite avec l'outil memoire (action retenir), en une phrase claire et générale, puis dis « C'est retenu ». N'enregistre pas les informations ponctuelles d'un seul jour (elles vont dans le planning ou les rappels), ni ce qui est déjà dans la liste.`
   +(L.length?`\nCE QUE TU AS DÉJÀ APPRIS DE KÉVIN (à appliquer systématiquement, c'est prioritaire sur tes habitudes) :\n`+L.map((m,i)=>`${i+1}. ${m.t}${m.par&&m.par!=="Kévin"?" (appris de "+m.par+")":""}`).join("\n"):"\nTu n'as encore rien appris de Kévin.")}
AI_TOOLS.unshift({name:"memoire",description:"Mémoire durable de l'assistant sur la façon de travailler de Kévin et de Réunion Toiture. action=retenir enregistre une règle ou habitude (texte : une phrase claire) ; action=modifier remplace la règle n° numero par texte ; action=oublier supprime la règle n° numero ; action=lister renvoie toutes les règles numérotées.",
  inputSchema:{type:"object",properties:{action:{type:"string",enum:["retenir","modifier","oublier","lister"]},texte:{type:"string"},numero:{type:"integer"}},required:["action"]},
  execute:(a)=>{const L=S.memo;const n=+a.numero;
    if(a.action==="retenir"){const t=String(a.texte||"").trim();if(!t)throw new Error("texte vide");
      if(!L.some(m=>norm(m.t)===norm(t))){L.push({t,d:today(),par:aiQui().nom});memoSave();aiAct("Retenu : "+t)}}
    else if((a.action==="modifier"||a.action==="oublier")&&!aiQui().gerant){throw new Error("Seul Kévin peut modifier ou supprimer une règle apprise. Propose à "+aiQui().nom+" de lui en parler.")}

    else if(a.action==="oublier"){if(!L[n-1])throw new Error("Pas de règle n° "+n);const x=L.splice(n-1,1)[0];memoSave();aiAct("Oublié : "+x.t)}
    return JSON.stringify(L.map((m,i)=>({n:i+1,regle:m.t,depuis:m.d,par:m.par||"Kévin"})))}});
function memoPanel(){const L=S.memo||[];

{const _rg2=VIEWS.reglages;VIEWS.reglages=()=>_rg2()+memoPanel()}

<script>
/* ===== Assistant : pièces jointes (PDF, Excel/CSV, images, captures d'écran collées) ===== */
const AJ=[];// {nom,kind,text,imgs:[Blob]}
const ajIcon=k=>k==="img"?"🖼️":k==="pdf"?"📄":k==="tab"?"📊":"📎";
function ajRender(){const z=$("#ajChips");if(!z)return;z.hidden=!AJ.length;
  z.innerHTML=AJ.map((a,i)=>`<span class="ajchip">${ajIcon(a.kind)} ${esc(a.nom)}${a.busy?" …":""}<button type="button" data-ajdel="${i}" aria-label="Retirer">×</button></span>`).join("")}
async function ajLimits(){if(AI.sample===undefined){try{AI.sample=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){AI.sample=null}}
  if(!AI.sample)return null;try{return await AI.sample.limits()}catch(e){return null}}
async function ajAdd(files){const lim=await ajLimits();const imgOk=!!(lim&&lim.images);const maxImg=imgOk?Math.min(+lim.images.maxCount||5,8):0;
  for(const f of files){const nom=f.name||("capture-"+new Date().toLocaleTimeString("fr-FR").replace(/:/g,"h")+".png");
    const a={nom,kind:"txt",text:"",imgs:[],busy:true};AJ.push(a);ajRender();
    try{
      if(/^image\//.test(f.type)){a.kind="img";if(!imgOk)throw new Error("Claude ne peut pas lire les images ici");a.imgs=[await shrink(f,2200)]}
      else if(f.type==="application/pdf"||/\.pdf$/i.test(nom)){a.kind="pdf";let t="";try{t=await pdfText(f)}catch(e){}
        a.text=String(t||"").slice(0,40000);
        if(imgOk&&(!a.text||a.text.replace(/\s/g,"").length<200)){a.imgs=await pdfPages(f,Math.min(maxImg,6))}// PDF scanné : on envoie les pages en images
        else if(imgOk&&AJ.reduce((s,x)=>s+x.imgs.length,0)<maxImg){a.imgs=await pdfPages(f,Math.min(2,maxImg))}// plans/schémas : 2 premières pages en image en plus du texte
        if(!a.text&&!a.imgs.length)throw new Error("PDF illisible")}
      else if(isTab(f)){a.kind="tab";const r=await tabRead(f);a.text=r.csv.slice(0,40000)}
      else if(/^text\//.test(f.type)||/\.(txt|md|json|csv)$/i.test(nom)){a.text=(await f.text()).slice(0,40000)}
      else throw new Error("format non pris en charge (PDF, Excel, CSV, image)");
      a.busy=false}
    catch(e){AJ.splice(AJ.indexOf(a),1);toast(nom+" : "+(e.message||"lecture impossible"),6000)}
    ajRender()}
  // limite du nombre d'images
  let n=0;AJ.forEach(a=>{const keep=Math.max(0,maxImg-n);if(a.imgs.length>keep){a.imgs=a.imgs.slice(0,keep);toast("Trop d'images : seules les "+maxImg+" premières seront lues.")}n+=a.imgs.length})}
/* envoi : on ajoute le contenu des fichiers au message et les images à l'appel */
const _aiSendJ=aiSend;
aiSend=async function(text){text=String(text||"").trim();if(!AJ.length||AI.busy)return _aiSendJ(text);
  if(AJ.some(a=>a.busy)){toast("Fichier en cours de lecture, patiente une seconde.");return}
  const L=AJ.splice(0);ajRender();const imgs=L.flatMap(a=>a.imgs).filter(b=>b instanceof Blob&&b.size>0);
  const q=text||"Analyse ce(s) fichier(s) et dis-moi ce que tu peux en faire dans le logiciel.";
  let app="\n\nFICHIERS JOINTS PAR KÉVIN :";let ni=0;
  L.forEach(a=>{app+=`\n--- ${a.nom} (${a.kind==="img"?"image":a.kind==="pdf"?"PDF":a.kind==="tab"?"tableur Excel converti en CSV, séparateur ;":"texte"}) ---`;
    if(a.imgs.length){app+=`\n[${a.imgs.length} image(s) jointe(s) : n° ${ni+1}${a.imgs.length>1?" à "+(ni+a.imgs.length):""}]`;ni+=a.imgs.length}
    if(a.text)app+="\n"+a.text});
  app+="\nUtilise ces fichiers pour répondre ; si Kévin demande de les reporter dans le logiciel (devis, fiche chantier, planning, rappels…), fais-le avec les outils. Dis ce que tu n'as pas pu lire.";
  AI.disp=q+"\n"+L.map(a=>ajIcon(a.kind)+" "+a.nom).join("\n");AI.imgs=imgs.length?imgs:null;
  AI.lastErr=null;
  try{await _aiSendJ(q+app);
    if(AI.lastErr==="invalid_request"&&AI.imgs){// les images ont été refusées : on renvoie avec le texte seul
      const last=AI.items[AI.items.length-1];if(last&&last.k==="err")AI.items.pop();const u=AI.items[AI.items.length-1];if(u&&u.k==="u")AI.items.pop();
      AI.imgs=null;AI.lastErr=null;const sans=L.filter(a=>a.imgs.length&&!a.text).map(a=>a.nom);
      await _aiSendJ(q+app+"\n(Les images n'ont pas pu être transmises"+(sans.length?" ; fichiers sans texte lisible : "+sans.join(", "):"")+". Travaille avec le texte et dis-le à l'utilisateur.)")}}
  finally{AI.disp=null;AI.imgs=null}};

(function ajUI(){const form=$("#aiForm"),ta=$("#aiIn");if(!form||!ta){setTimeout(ajUI,500);return}

  const btn=document.createElement("button");btn.type="button";btn.className="btn sm";btn.textContent="📎 Joindre";btn.title="Joindre un PDF, un fichier Excel ou une image (tu peux aussi coller une capture d'écran avec Ctrl/⌘+V)";
  const send=$("#aiSend");send.parentNode.insertBefore(btn,send);send.parentNode.insertBefore(inp,send);
  btn.addEventListener("click",()=>inp.click());inp.addEventListener("change",()=>{const f=[...inp.files];inp.value="";if(f.length)ajAdd(f)});
  const note=form.querySelector(".ai-note");if(note)note.textContent="Entrée pour envoyer · Maj+Entrée pour aller à la ligne · ⌘/Ctrl+V pour coller une capture";
  ta.addEventListener("paste",e=>{const f=[...(e.clipboardData&&e.clipboardData.files||[])];if(f.length){e.preventDefault();ajAdd(f)}});
  form.addEventListener("dragover",e=>{e.preventDefault();form.classList.add("ajdrag")});form.addEventListener("dragleave",()=>form.classList.remove("ajdrag"));
  form.addEventListener("drop",e=>{e.preventDefault();form.classList.remove("ajdrag");const f=[...(e.dataTransfer&&e.dataTransfer.files||[])];if(f.length)ajAdd(f)});
  chips.addEventListener("click",e=>{const b=e.target.closest("[data-ajdel]");if(b){AJ.splice(+b.dataset.ajdel,1);ajRender()}})})();

<script>

/* lignes que l'affectation ajoutera (même calcul que dvChantier) */
function affNb(d){let n=0;(d.lignes||[]).forEach(l=>{if(l.mo)return;if(l.fourn&&l.fourn.length)n+=l.fourn.filter(x=>(+x.q||0)>0).length;else if((+l.qte||0)>0&&(+l.pa||0)>=0&&l.cat!=="")n++});return n}
function affDejaChez(id){return Object.keys(S.chantiers).filter(k=>(S.chantiers[k].lignes||[]).some(l=>l.devis===id))}
function affOpen(id){const d=S.devis[id];if(!d)return;S.aff={id,cid:(d.chantierId&&S.chantiers[d.chantierId]?d.chantierId:d.cible&&S.chantiers[d.cible]?d.cible:"")};affRender()}
function affRender(){let bg=document.getElementById("affbg");const a=S.aff;if(!a){if(bg)bg.remove();return}
  const d=S.devis[a.id];if(!d){S.aff=null;return affRender()}
  if(!bg){bg=document.createElement("div");bg.id="affbg";bg.className="affbg";document.body.appendChild(bg)}
  const ids=Object.keys(S.chantiers).filter(k=>S.chantiers[k].fiche!==false&&!S.chantiers[k].archive).sort((x,y)=>S.chantiers[x].nom.localeCompare(S.chantiers[y].nom,"fr"));
  const n=affNb(d),t=dvTotaux(d),deja=affDejaChez(a.id),c=a.cid?S.chantiers[a.cid]:null;
  const ici=c&&deja.includes(a.cid),ailleurs=deja.filter(k=>k!==a.cid);
  bg.innerHTML=`<div class="affbox" role="dialog" aria-modal="true"><h2>Affecter au chantier</h2>
   <div>Devis <b>${esc(d.num)}</b> · ${esc(d.client||"")} · ${eur.format(t.htN)} HT</div>
   <label class="mut">Chantier <select id="affch" style="width:100%;margin-top:4px"><option value="">— nouveau chantier « ${esc(norm((d.client||"CLIENT")))} » —</option>${ids.map(k=>`<option value="${esc(k)}"${k===a.cid?" selected":""}>${esc(S.chantiers[k].nom)}</option>`).join("")}</select></label>
   <div><b>${n}</b> ligne${n>1?"s":""} de fournitures seront ajoutées à la fiche d'achat${c?" de <b>"+esc(c.nom)+"</b>":""}, et le marché HT passera à <b>${eur.format(t.htN)}</b>${c?" (aujourd'hui "+eur.format(+c.marcheHT||0)+")":""}.</div>
   ${ici?`<div class="affwarn">⚠️ Ce devis est déjà affecté à ce chantier. Confirmer <b>remplace</b> ses lignes (pas de doublon).</div>`:""}
   ${ailleurs.length?`<div class="affwarn">⚠️ Ce devis est aussi affecté à : ${ailleurs.map(k=>esc(S.chantiers[k].nom)).join(", ")}.</div>`:""}
   ${!n?`<div class="affwarn">Ce devis n'a aucune fourniture à ajouter.</div>`:""}
   <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" data-affno>Annuler</button><button class="btn pri" data-affok${n?"":" disabled"}>${ici?"Remplacer les lignes":"Confirmer l'affectation"}</button></div></div>`}
function dvAffecter(id,cid){const d=S.devis[id];const impId="imp"+Date.now().toString(36);const date=today();
  let prevMarche=null;if(cid&&S.chantiers[cid]){d.chantierId=cid;prevMarche=+S.chantiers[cid].marcheHT||0}else d.chantierId=undefined;
  const prevLignes=cid&&S.chantiers[cid]?(S.chantiers[cid].lignes||[]).filter(l=>l.devis===id).map(l=>JSON.parse(JSON.stringify(l))):[];
  const out=dvChantier(id);const c=S.chantiers[out];
  let n=0;(c.lignes||[]).forEach(l=>{if(l.devis===id){l.imp=impId;l.poste="Devis "+d.num+" · importé le "+date.split("-").reverse().join("/");n++}});
  c.imports=(c.imports||[]).concat([{id:impId,devis:id,num:d.num,date,n,marchePrev:prevMarche,lignesPrev:prevLignes}]).slice(-10);
  saveChantier(out,0);return{cid:out,n}}
function affAnnuler(cid){const c=S.chantiers[cid];const imp=(c.imports||[]).slice(-1)[0];if(!imp)return;
  const avant=(c.lignes||[]).length;c.lignes=(c.lignes||[]).filter(l=>l.imp!==imp.id);const n=avant-c.lignes.length;
  if(imp.lignesPrev&&imp.lignesPrev.length)c.lignes=c.lignes.concat(imp.lignesPrev);
  if(imp.marchePrev!=null)c.marcheHT=imp.marchePrev;c.imports.pop();saveChantier(cid,0);
  const d=S.devis[imp.devis];if(d&&!(c.lignes||[]).some(l=>l.devis===imp.devis)&&d.chantierId===cid){d.chantierId=undefined;d.cible=cid;saveDevis(imp.devis,0)}
  toast(n+" ligne(s) du devis "+imp.num+" retirée(s)"+(imp.marchePrev!=null?", marché remis à "+eur.format(imp.marchePrev):""));render()}
function affRetirerDevis(cid,dev){const c=S.chantiers[cid];const avant=(c.lignes||[]).length;
  c.lignes=(c.lignes||[]).filter(l=>(l.devis||"poste:"+l.poste)!==dev);c.imports=(c.imports||[]).filter(x=>x.devis!==dev);saveChantier(cid,0);
  const d=S.devis[dev];if(d&&d.chantierId===cid){d.chantierId=undefined;d.cible=cid;saveDevis(dev,0)}
  toast((avant-c.lignes.length)+" ligne(s) retirée(s) de la fiche d'achat. Vérifie le marché HT.");render()}
/* bloc sur la fiche chantier : provenance des lignes + annulation */
function affRow(c,cid){const g={};(c.lignes||[]).forEach(l=>{if(!l.devis&&!/^Devis /i.test(l.poste||""))return;const k=l.devis||"poste:"+l.poste;(g[k]=g[k]||{n:0,tot:0,nom:l.devis&&S.devis[l.devis]?"Devis "+S.devis[l.devis].num:(l.poste||"Devis")});g[k].n++;g[k].tot+=(+l.qte||0)*(+l.pu||0)});
  const ks=Object.keys(g);const imp=(c.imports||[]).slice(-1)[0];if(!ks.length&&!imp)return"";
  const conf=S.affConf;
  return `<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><span class="mut" style="font-weight:700">📥 Lignes venant de devis</span>
   ${ks.map(k=>`<span class="pill ${ks.length>1?"p-warn":"p-acc"}">${esc(g[k].nom)} · ${g[k].n} ligne${g[k].n>1?"s":""} · ${eur.format(g[k].tot)}</span>${conf===cid+"|"+k?`<span class="confirm">Retirer ces ${g[k].n} lignes ? <button class="btn sm pri needwrite" data-affretok="${esc(k)}">Oui</button><button class="btn sm" data-affretno>Non</button></span>`:`<button class="btn sm ghost needwrite" data-affret="${esc(k)}">Retirer</button>`}`).join("")}
   ${imp?`<button class="btn sm needwrite" data-affundo title="Supprime les ${imp.n} lignes ajoutées le ${esc(imp.date)} et remet le marché d'avant">↩︎ Annuler la dernière importation (devis ${esc(imp.num)})</button>`:""}
   ${ks.length>1?`<span class="mut" style="font-size:12px">Plusieurs devis alimentent cette fiche : vérifie qu'il n'y a pas de doublon.</span>`:""}</div>`}

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const ds=b.dataset;
  if(ds.affno!==undefined){S.aff=null;affRender();return}
  if(ds.affok!==undefined&&S.aff&&S.canWrite){const sel=document.getElementById("affch");const cid=sel?sel.value:S.aff.cid;const id=S.aff.id;S.aff=null;affRender();
    const r=dvAffecter(id,cid||null);S.chantierId=r.cid;toast(r.n+" ligne(s) du devis ajoutée(s) à « "+S.chantiers[r.cid].nom+" ». Tu peux annuler depuis la fiche chantier.",7000);go("chantiers");return}
  if(ds.dvaff!==undefined&&S.canWrite){affOpen(ds.dvaff);return}
  if(!S.canWrite||S.view!=="chantiers")return;const cid=S.chantierId;if(!cid||!S.chantiers[cid])return;
  if(ds.affundo!==undefined){affAnnuler(cid);return}
  if(ds.affret!==undefined){S.affConf=cid+"|"+ds.affret;render();return}
  if(ds.affretno!==undefined){S.affConf=null;render();return}
  if(ds.affretok!==undefined){S.affConf=null;affRetirerDevis(cid,ds.affretok);return}
},true);
document.addEventListener("change",e=>{if(e.target.id==="affch"&&S.aff){S.aff.cid=e.target.value;affRender()}});
/* bandeau "lecture seule" sur les devis InFast */
{const _dv=VIEWS.devis;VIEWS.devis=()=>{const h=_dv();const d=S.dvId&&S.devis[S.dvId];if(!d||d.source!=="InFast"||S.dvRegles)return h;
  const deja=affDejaChez(S.dvId);
  const ban=`<div class="panel pad row" style="gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;border:2px solid var(--gold)"><span style="font-size:20px">🔒</span>
    <div style="flex:1;min-width:220px"><b>Devis InFast en lecture seule</b><div class="mut" style="font-size:12.5px">Il sert à consulter et à en parler avec l'assistant. Rien n'est ajouté aux fournitures tant que tu ne l'affectes pas.${deja.length?" Déjà affecté à : "+deja.map(k=>esc(S.chantiers[k].nom)).join(", ")+".":d.cible&&S.chantiers[d.cible]?" Chantier prévu : "+esc(S.chantiers[d.cible].nom)+".":""}</div></div>
    <button class="btn pri needwrite" data-dvaff="${esc(S.dvId)}">📥 ${deja.length?"Réaffecter au chantier":"Affecter au chantier"}</button></div>`;
  const i=h.indexOf('<div class="split">');return `<div class="dvro">`+(i>=0?h.slice(0,i)+ban+h.slice(i):ban+h)+`</div>`}}

<script>
/* ===== Outil assistant : lire_devis_infast (lecture seule, ne modifie jamais rien) ===== */
function ldNum(t){const x=parseFloat(String(t).replace(",","."));return isFinite(x)?x:null}
function ldEchaf(txt){const t=String(txt||"").toLowerCase();if(!/[ée]chafaud/.test(t))return null;const o={};
  let m=t.match(/hauteur[^0-9]{0,25}(\d+(?:[.,]\d+)?)\s*m/);if(m)o.hauteur_m=ldNum(m[1]);
  m=t.match(/longueur[^0-9]{0,25}?(\d+(?:[.,]\d+)?)\s*m/)||t.match(/(?:fa[çc]ade|lin[ée]aire)\s*(?:de|:|=)?\s*(\d+(?:[.,]\d+)?)\s*m/);if(m)o.longueur_facade_m=ldNum(m[1]);
  if(o.hauteur_m==null||o.longueur_facade_m==null){m=t.match(/(\d+(?:[.,]\d+)?)\s*m?\s*[x×*]\s*(\d+(?:[.,]\d+)?)\s*m/);if(m){const a=ldNum(m[1]),b=ldNum(m[2]);
    if(o.longueur_facade_m==null&&o.hauteur_m==null){o.longueur_facade_m=Math.max(a,b);o.hauteur_m=Math.min(a,b);o.note="dimensions lues « "+m[0]+" » : la plus grande est supposée être la longueur"}}}
  return Object.keys(o).length?o:{note:"dimensions non trouvées dans le libellé"}}
function ldResume(x){const t=dvTotaux(x);const ch=x.chantierId&&S.chantiers[x.chantierId]?S.chantiers[x.chantierId].nom:x.cible&&S.chantiers[x.cible]?S.chantiers[x.cible].nom+" (prévu, non affecté)":"";
  return{numero:x.num,client:x.client||"",date:x.cree||"",chantier:ch,source:x.source||"logiciel",total_ht:Math.round(t.htN*100)/100,total_ttc:Math.round(t.ttc*100)/100}}
AI_TOOLS.splice(1,0,{name:"lire_devis_infast",description:"Renvoie le contenu d'un devis importé depuis InFast (lecture seule) : lignes, quantités, unités, prix unitaires, totaux. Ne modifie jamais la fiche chantier ni les fournitures. Pour les lignes d'échafaudage, donne si possible la hauteur et la longueur de façade.",
  inputSchema:{type:"object",properties:{chantier:{type:"string",description:"Nom exact du chantier ou du client (ex. SDC LES POIVRIERS). Vide pour lister les devis disponibles."},numero_devis:{type:"string",description:"Numéro du devis InFast, si connu."},recherche:{type:"string",description:"Mot-clé pour filtrer les lignes (ex. échafaudage, nacelle, tôle)."}}},
  execute:(a)=>{const all=dvList();const inf=all.filter(x=>x.source==="InFast");const base=inf.length?inf:all;
    const k=norm(a.chantier||""),num=String(a.numero_devis||"").trim().toUpperCase();
    let L=base;
    if(num)L=L.filter(x=>String(x.num||"").toUpperCase().includes(num));
    if(k)L=L.filter(x=>{const noms=[x.client,x.chantierId&&S.chantiers[x.chantierId]&&S.chantiers[x.chantierId].nom,x.cible&&S.chantiers[x.cible]&&S.chantiers[x.cible].nom].map(v=>norm(v||""));
      return noms.some(n=>n&&(n===k||n.includes(k)||k.includes(n)))});
    if(!L.length||(!k&&!num))return JSON.stringify({trouve:false,message:(!k&&!num)?"Liste des devis disponibles":"Aucun devis ne correspond",devis_disponibles:base.slice(0,40).map(ldResume)});
    const q=norm(a.recherche||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
    return JSON.stringify({trouve:true,lecture_seule:true,devis:L.slice(0,3).map(x=>{let lignes=(x.lignes||[]).map(l=>{const qte=+l.qte||0,pu=+l.pv||0;const txt=(l.titre||"")+" "+(l.desc||"");
        const o={etape:l.etape||"",libelle:l.titre||"",detail:String(l.desc||"").slice(0,300),quantite:qte,unite:l.unite||"",prix_unitaire_ht:Math.round(pu*100)/100,total_ht:Math.round(qte*pu*100)/100};
        const e=ldEchaf(txt);if(e)o.echafaudage=e;return o});
      if(q)lignes=lignes.filter(o=>(norm(o.libelle+" "+o.detail+" "+o.etape).normalize("NFD").replace(/[̀-ͯ]/g,"")).includes(q));
      return Object.assign(ldResume(x),{nb_lignes:lignes.length,lignes:lignes.slice(0,80)})})})}});
/* priorité des outils : au-delà de 16, on retire d'abord ceux qui ne concernent pas la demande */
{const _ao=aiOutils;aiOutils=function(text){const t=String(text||"");const max=Math.min(+AI.maxTools||16,16);let L=AI_TOOLS.slice();
  const opt=[["pliages",/pli|fa[iî]tage|rive|solin|noue|ar[eê]tier|d[ée]velopp/i],["ajouter_entree_sortie",/entr[ée]e|sortie|ind[ée]pendant|passage|embauch|arriv/i],["definir_sortie",/sortie|d[ée]part|quitte|fin de contrat|licenci|d[ée]mission/i]];
  for(const [n,re] of opt){if(L.length<=max)break;if(!re.test(t))L=L.filter(x=>x.name!==n)}
  return L.length<=max?L:_ao(text)}}
{const _mt=memoTexte;memoTexte=function(){return _mt()+"\nDEVIS INFAST : pour connaître le contenu d'un devis (lignes, quantités, prix, échafaudage…), utilise l'outil lire_devis_infast. Un devis InFast sert à l'information et aux échanges : n'ajoute jamais ses lignes aux fournitures d'un chantier sans la demande et la confirmation explicite de Kévin. Pour l'échafaudage, la surface en m² = hauteur × longueur de façade ; si une dimension manque, demande-la."}}
</script>
<script>
/* ===== Outils de l'assistant regroupés par thème (limite de 16 outils par message) ===== */
(function(){const T=n=>AI_TOOLS.find(x=>x.name===n);let caches={};const run=(n,a)=>{const t=caches[n]||T(n);if(!t)throw new Error("Fonction indisponible : "+n);return t.execute(a)};
  const pick=(a,ks)=>{const o={};ks.forEach(k=>{if(a[k]!==undefined&&a[k]!==null&&a[k]!=="")o[k]=a[k]});return o};
  const personnel={name:"personnel",description:"Gère les présences d'un ouvrier. action=absent_jour : marque (absent=true) ou retire (absent=false) une absence ponctuelle un jour (date) ; il est retiré des équipes ce jour. action=ajouter_periode : période d'indisponibilité (type ABSENCE, CONGÉS, ARRÊT DE TRAVAIL, FORMATION ou AUTRE, du, au vide si retour inconnu) ; il disparaît du planning. action=supprimer_periode : supprime la période qui commence à du. action=date_sortie : fixe la date de sortie de la société (date ; vide pour l'effacer). action=entree_sortie : ajoute une période de présence (du, au) pour un indépendant ou un ouvrier de passage. Dates AAAA-MM-JJ.",
    inputSchema:{type:"object",properties:{action:{type:"string",enum:["absent_jour","ajouter_periode","supprimer_periode","date_sortie","entree_sortie"]},nom:{type:"string"},date:{type:"string"},absent:{type:"boolean"},type:{type:"string",enum:["ABSENCE","CONGÉS","ARRÊT DE TRAVAIL","FORMATION","AUTRE"]},du:{type:"string"},au:{type:"string"}},required:["action","nom"]},
    execute:a=>{switch(a.action){
      case "absent_jour":return run("marquer_absent",{date:a.date,nom:a.nom,absent:a.absent!==false});
      case "ajouter_periode":return run("ajouter_periode",pick(a,["nom","type","du","au"]));
      case "supprimer_periode":return run("supprimer_periode",pick(a,["nom","du"]));
      case "date_sortie":return run("definir_sortie",{nom:a.nom,date:a.date||""});
      case "entree_sortie":return run("ajouter_entree_sortie",pick(a,["nom","du","au"]));
      default:throw new Error("action inconnue")}}};
  const chantier={name:"chantier",description:"Fiche d'un chantier. action=lire : renvoie marché, fournitures (lignes), main d'œuvre par ouvrier, marge, jours, bénéfice par jour. action=ajouter_fourniture : ajoute une ligne de fourniture (article, quantite, et si connus categorie, unite, prix_unitaire, fournisseur ; sinon pris dans le catalogue). action=modifier_marche : change le marché HT (montant). Ne jamais y reporter un devis InFast sans demande et confirmation de Kévin.",
    inputSchema:{type:"object",properties:{action:{type:"string",enum:["lire","ajouter_fourniture","modifier_marche"]},chantier:{type:"string",description:"Nom du chantier"},article:{type:"string"},quantite:{type:"number"},categorie:{type:"string"},unite:{type:"string"},prix_unitaire:{type:"number"},fournisseur:{type:"string"},montant:{type:"number"}},required:["action","chantier"]},
    execute:a=>{switch(a.action){
      case "lire":return run("lire_chantier",{nom:a.chantier});
      case "ajouter_fourniture":return run("ajouter_fourniture",pick(a,["chantier","categorie","article","quantite","unite","prix_unitaire","fournisseur"]));
      case "modifier_marche":return run("modifier_marche",{chantier:a.chantier,montant:a.montant});
      default:throw new Error("action inconnue")}}};
  const sav={name:"sav",description:"Dossiers SAV (après-vente). action=lister : client, objet, statut, intervention prévue, prochain rappel, dernière note (filtre en_cours par défaut, a_relancer, resolus ou tous). action=creer : ouvre un dossier (client et objet obligatoires ; telephone, adresse, chantier d'origine, description, urgent, intervention_prevue, rappel_jours 7/14/30 ; premier rappel 7 jours plus tard par défaut). action=mettre_a_jour : dossier = numéro SAV-AAAA-NNN ou nom du client ; relance_faite (reprogramme le rappel), note, statut, intervention_prevue, prochain_rappel. Dates AAAA-MM-JJ.",
    inputSchema:{type:"object",properties:{action:{type:"string",enum:["lister","creer","mettre_a_jour"]},filtre:{type:"string",enum:["en_cours","a_relancer","resolus","tous"]},dossier:{type:"string"},client:{type:"string"},telephone:{type:"string"},adresse:{type:"string"},chantier:{type:"string"},objet:{type:"string"},description:{type:"string"},urgent:{type:"boolean"},intervention_prevue:{type:"string"},rappel_jours:{type:"integer",enum:[7,14,30]},relance_faite:{type:"boolean"},note:{type:"string"},statut:{type:"string",enum:["ouvert","planifie","attente","resolu"]},prochain_rappel:{type:"string"}},required:["action"]},
    execute:a=>{switch(a.action){
      case "lister":return run("lire_sav",pick(a,["filtre"]));
      case "creer":return run("creer_sav",pick(a,["client","telephone","adresse","chantier","objet","description","urgent","intervention_prevue","rappel_jours"]));
      case "mettre_a_jour":return run("maj_sav",pick(a,["dossier","relance_faite","note","statut","intervention_prevue","prochain_rappel"]));
      default:throw new Error("action inconnue")}}};
  const anciens=["marquer_absent","ajouter_periode","supprimer_periode","definir_sortie","ajouter_entree_sortie","lire_chantier","ajouter_fourniture","modifier_marche","lire_sav","creer_sav","maj_sav"];
  anciens.forEach(n=>{const t=T(n);if(t)caches[n]=t});
  for(let i=AI_TOOLS.length-1;i>=0;i--)if(anciens.includes(AI_TOOLS[i].name))AI_TOOLS.splice(i,1);
  const k=AI_TOOLS.findIndex(x=>x.name==="lire_planning");AI_TOOLS.splice(k>=0?k+2:AI_TOOLS.length,0,personnel,chantier,sav);
})();
</script>
